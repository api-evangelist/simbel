aid: simbel
name: Simbel
description: >-
  Simbel is a Paris-based HR technology company (founded 2021, backed by
  Speedinvest) offering a smart, unified training management suite that combines
  a Training Management System (TMS) and a Learning Management System (LMS) in
  one platform. It helps HR and L&D teams automate the full training lifecycle,
  from need assessment and request approvals through session organization,
  e-learning delivery, real-time reporting, and legal compliance (BPF, Qualiopi,
  BDES). Simbel connects to major HRIS and learning tools such as Workday, SAP
  SuccessFactors, ADP, Lucca, Payfit, BambooHR, 360Learning, and Docebo through
  pre-built integrations. As of this enrichment pass Simbel publishes no public
  developer API, API documentation, or developer portal; integrations are
  delivered as managed connectors rather than a self-serve public API.
